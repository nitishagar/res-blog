name: Weekly publish

# Renders the next queued post, updates the index/sitemap/feed, commits, and
# deploys to Cloudflare Workers. Fires Mondays 03:00 UTC; workflow_dispatch
# allows manual runs (dry-runs, backfills, retries).

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
      - name: Render next queued post
        run: node scripts/publish.js
      - name: Gate on test suite
        run: node test.js
      - name: Commit rendered post
        run: |
          git config user.name 'res-blog-publisher'
          git config user.email 'res-blog-publisher@users.noreply.github.com'
          git add index.html sitemap.xml feed.xml posts/queue.json posts/*.html posts/covers/
          git diff --cached --quiet && echo 'nothing to commit' && exit 0
          git commit -m "publish: $(node -e "console.log(require('./posts/queue.json').posts.filter(p=>p.status==='published').slice(-1)[0].slug)")"
          git push
      - name: Deploy to Cloudflare Workers
        run: npx -y wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
