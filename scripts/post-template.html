<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} — Nitish Agarwal</title>
    <meta name="description" content="{{DEK}}">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DEK}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:image" content="{{COVER_URL}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DEK}}">
    <meta name="twitter:image" content="{{COVER_URL}}">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{TITLE}}",
        "description": "{{DEK}}",
        "url": "{{CANONICAL_URL}}",
        "datePublished": "{{DATE_ISO}}",
        "author": { "@type": "Person", "name": "Nitish Agarwal", "url": "https://res-blog.nitishagar.workers.dev/" },
        "image": "{{COVER_URL}}"
    }
    </script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="/" class="logo">Nitish Agarwal<span class="logo-dot">.</span></a>
                <ul class="nav-menu">
                    <li><a href="/#about" class="nav-link">About</a></li>
                    <li><a href="/#portfolio" class="nav-link">Work</a></li>
                    <li><a href="/blog" class="nav-link">Writing</a></li>
                    <li><a href="/#contact" class="nav-link">Contact</a></li>
                    <li><a href="https://github.com/nitishagar" class="nav-link nav-cta" target="_blank" rel="noopener noreferrer">GitHub ↗</a></li>
                </ul>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </nav>
    </header>
    <main id="main-content">
        <article class="post">
            <div class="container post-narrow">
                <p><a href="/blog" class="blog-link">&larr; All writing</a></p>
                <p class="section-index">{{SERIES_TAG}}</p>
                <h1 class="post-title">{{TITLE}}</h1>
                <p class="post-dek">{{DEK}}</p>
                <p class="post-meta">{{DATE}} · {{READ_TIME}}</p>
                {{TAGS_HTML}}
                {{HERO_FIGURE}}
                <div class="ad-slot" data-ea-publisher="{{EA_PUBLISHER}}" data-ea-type="image"></div>
                <div class="post-body">
{{CONTENT_HTML}}
                </div>
                <nav class="post-nav">
                    {{PREV_LINK}}
                    {{NEXT_LINK}}
                </nav>
            </div>
        </article>
    </main>
    <footer class="footer">
        <div class="container footer-inner">
            <p>&copy; 2026 Nitish Agarwal. All rights reserved.</p>
            <p class="footer-note">Static site · No trackers</p>
        </div>
    </footer>
    <script src="/script.js"></script>
</body>
</html>
